name: Build WinCEControl

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  # ============================================
  # 1. Проверка кода (всегда работает)
  # ============================================
  check:
    runs-on: ubuntu-22.04
    name: 📝 Code Check
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    
    - name: Check files
      run: |
        echo "========================================="
        echo "Checking repository..."
        echo "========================================="
        
        echo "Files in repository:"
        ls -la
        
        if [ -d "src" ]; then
          echo "✅ src/ exists"
          echo "Files in src/:"
          ls -la src/
        else
          echo "⚠️  src/ not found"
        fi
        
        [ -f "README.md" ] && echo "✅ README.md" || echo "⚠️  No README.md"
        [ -f "LICENSE" ] && echo "✅ LICENSE" || echo "⚠️  No LICENSE"

  # ============================================
  # 2. Сборка (простая, без реального SDK)
  # ============================================
  build:
    runs-on: windows-2022
    name: 🏗️ Build (${{ matrix.platform }}, ${{ matrix.configuration }})
    needs: check
    
    strategy:
      fail-fast: false  # Не останавливать все при ошибке одной
      matrix:
        platform: [ARM, MIPS, SH4, x86]
        configuration: [Debug, Release]
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    
    - name: Display environment
      run: |
        echo "========================================="
        echo "System Information"
        echo "========================================="
        systeminfo | findstr /B /C:"OS Name" /C:"OS Version"
        echo ""
        echo "Visual Studio locations:"
        dir "C:\Program Files\Microsoft Visual Studio\2022\*" 2>nul || echo "VS2022 not found in standard location"
    
    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2
    
    - name: Create dummy SDK
      run: |
        echo "Creating dummy Windows CE SDK..."
        mkdir "C:\dummy_sdk\include" -Force
        mkdir "C:\dummy_sdk\lib" -Force
        
        @"
        // Dummy Windows CE SDK header
        #pragma once
        #define WINAPI
        typedef void* HANDLE;
        "# > "C:\dummy_sdk\include\windows.h"
        
        @"
        // Dummy RAPI header
        #pragma once
        #include <windows.h>
        "# > "C:\dummy_sdk\include\rapi.h"
        
        echo "Dummy SDK created"
    
    - name: Create dummy source (if no real source)
      run: |
        echo "Creating dummy source files..."
        if not exist "src" mkdir src
        
        if not exist "src\main.cpp" (
          @"
          // WinCEControl - Dummy implementation for CI
          #include <iostream>
          
          int main() {
              std::cout << "WinCEControl - CI Build" << std::endl;
              std::cout << "Platform: ${{ matrix.platform }}" << std::endl;
              std::cout << "Configuration: ${{ matrix.configuration }}" << std::endl;
              return 0;
          }
          "# > "src\main.cpp"
        )
        
        echo "Source files ready:"
        dir src\
    
    - name: Create Visual Studio project
      run: |
        echo "Creating Visual Studio project..."
        
        @"
        <Project DefaultTargets="Build" xmlns="http://schemas.microsoft.com/developer/msbuild/2003">
          <ItemGroup Label="ProjectConfigurations">
            <ProjectConfiguration Include="${{ matrix.configuration }}|${{ matrix.platform }}">
              <Configuration>${{ matrix.configuration }}</Configuration>
              <Platform>${{ matrix.platform }}</Platform>
            </ProjectConfiguration>
          </ItemGroup>
          <PropertyGroup Label="Globals">
            <ProjectGuid>{12345678-1234-1234-1234-123456789012}</ProjectGuid>
            <RootNamespace>WinCEControl</RootNamespace>
          </PropertyGroup>
          <Import Project="$(VCTargetsPath)\Microsoft.Cpp.Default.props" />
          <PropertyGroup>
            <ConfigurationType>Application</ConfigurationType>
            <PlatformToolset>v143</PlatformToolset>
            <CharacterSet>Unicode</CharacterSet>
          </PropertyGroup>
          <Import Project="$(VCTargetsPath)\Microsoft.Cpp.props" />
          <ItemGroup>
            <ClCompile Include="src\main.cpp" />
          </ItemGroup>
          <Import Project="$(VCTargetsPath)\Microsoft.Cpp.targets" />
        </Project>
        "# > WinCEControl.vcxproj
        
        echo "Project file created"
    
    - name: Build
      run: |
        echo "========================================="
        echo "Building for ${{ matrix.platform }} - ${{ matrix.configuration }}"
        echo "========================================="
        
        # Создаём папку для вывода
        mkdir build-${{ matrix.platform }}-${{ matrix.configuration }} -Force
        
        # Используем MSBuild
        msbuild WinCEControl.vcxproj /p:Configuration=${{ matrix.configuration }} /p:Platform=${{ matrix.platform }} /p:OutDir=build-${{ matrix.platform }}-${{ matrix.configuration }}\
        
        echo "Build completed"
    
    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: WinCEControl-${{ matrix.platform }}-${{ matrix.configuration }}
        path: build-${{ matrix.platform }}-${{ matrix.configuration }}/
        retention-days: 30
